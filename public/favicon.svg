<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="round"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <!-- Green upper-left (hoist) -->
    <rect width="512" height="512" fill="#009543"/>
    <!-- Yellow diagonal band: lower-left → upper-right -->
    <polygon fill="#FBDE4A" points="0,399 399,0 512,0 512,112 112,512 0,512"/>
    <!-- Red lower-right (fly) -->
    <polygon fill="#DC241F" points="112,512 512,512 512,112"/>
  </g>
</svg>
